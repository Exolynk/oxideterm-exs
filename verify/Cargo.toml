[package]
name = "exs-oxideterm-verify"
version = "0.1.0"
edition = "2024"
publish = false
description = "Verifies the built ExS OxideTerm plugin like the host does and compares it with the ExS compiler's highlighter."

[dependencies]
# Same tree-sitter version as OxideTerm 2.x. The grammar is linked natively
# (from the same generated sources as parser.wasm); the WASM build itself is
# checked with `tree-sitter test --wasm` in scripts/build.sh.
tree-sitter = "0.27.0"
tree-sitter-language = "0.1"
# Reference highlighter used by the Exolynk platform IDE.
exs-compiler = "0.2.1"
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"
